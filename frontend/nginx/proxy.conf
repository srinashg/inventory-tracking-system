# Shared settings for requests forwarded to the API.
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;

# X-Forwarded-For is OVERWRITTEN with the address that really connected to this server. $proxy_add_x_forwarded_for would
# append to whatever the client sent, letting anyone invent addresses; the API only believes the last entry anyway.
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;

# Cookies (Cookie, Set-Cookie) and the X-CSRF-TOKEN header pass through untouched: nginx does not rewrite them.
proxy_redirect off;
