# A stand-in for the API used by web-image.sh: it answers every request with the request details the web container forwarded,
# and sets a cookie the way the real API does, so the test can check exactly what nginx passes along.
server {
    listen 8080;
    location / {
        default_type application/json;
        add_header Set-Cookie "techstore.session=fake; path=/; samesite=strict; httponly" always;
        add_header Cache-Control "no-store" always;
        return 200 '{"xff":"$http_x_forwarded_for","realip":"$http_x_real_ip","cookie":"$http_cookie","csrf":"$http_x_csrf_token","host":"$http_host","uri":"$request_uri","method":"$request_method"}';
    }
}
