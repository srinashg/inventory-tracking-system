# Continuous integration for TechStore. Nothing here deploys anything or uses a secret.
#   changes   decides which checks a pull request needs (documentation-only changes skip the expensive ones)
#   backend   builds the .NET solution and runs the xUnit suites against a throw-away PostgreSQL
#   frontend  installs the npm packages, lints, type-checks and builds the React app, and runs the Vitest suite
#   browser   runs the Playwright suite against the real API and a throw-away PostgreSQL (login, roles, workflow, sessions)
#   ci-gate   the ONE check to require before merging: it fails unless every check that had to run succeeded
# Later steps add more jobs (security, containers) and list them in the gate.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Read-only token for every job unless a job asks for more (none does).
permissions:
  contents: read

# A newer push to the same pull request replaces the older run; runs on main are never cancelled.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      browser: ${{ steps.filter.outputs.browser }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2 # enough to compare a pull request's merge commit with the branch it merges into
          persist-credentials: false

      - name: Decide which checks are needed
        id: filter
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -u
          emit() { echo "$1=$2" >> "$GITHUB_OUTPUT"; }

          # Anything that is not a pull request (a push to main, a manual run) runs everything.
          if [ "$EVENT" != "pull_request" ]; then
            echo "Event '$EVENT': running everything."
            emit backend true; emit frontend true; emit browser true
            exit 0
          fi

          # The pull request's merge commit has the target branch as its first parent.
          if ! files=$(git diff --name-only HEAD^1 HEAD); then
            echo "Could not compare with the target branch: running everything to be safe."
            emit backend true; emit frontend true; emit browser true
            exit 0
          fi

          echo "Changed files:"
          while IFS= read -r file; do echo "  $file"; done <<< "$files"

          changed() { echo "$files" | grep -qE "$1"; }

          # Files that can change what the backend does or how it is built and tested.
          backend=false
          if changed '^(backend/|tests/TechStore\.|TechStore\.slnx$|global\.json$|Directory\.(Build|Packages)\.|[Nn]u[Gg]et\.[Cc]onfig$|\.github/workflows/ci\.yml$)'; then backend=true; fi

          # Everything under frontend/ (source, tests, lockfile, Dockerfile, nginx files) can change the build, the type-check or the tests.
          frontend=false
          if changed '^(frontend/|\.github/workflows/ci\.yml$)'; then frontend=true; fi

          # The browser tests exercise the whole application, so any change to the backend or the frontend needs them.
          browser=false
          if [ "$backend" = true ] || [ "$frontend" = true ]; then browser=true; fi

          emit backend "$backend"; emit frontend "$frontend"; emit browser "$browser"
          echo "Decisions: backend=$backend frontend=$frontend browser=$browser"

  backend:
    name: Backend build and tests
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    # A disposable PostgreSQL that exists only for this job. "trust" authentication matches the local default the tests expect
    # (user postgres, no password), so no credential exists anywhere; the server is reachable only from this runner.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore dependencies
        run: dotnet restore TechStore.slnx

      - name: Build
        id: build
        run: dotnet build TechStore.slnx --no-restore

      # The three suites run as separate steps so one failure does not hide the others; any failing step fails the job.
      - name: Test - business services
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: dotnet test tests/TechStore.Services.Tests --no-build --logger "trx;LogFileName=services.trx" --results-directory test-results

      - name: Test - authentication and sessions
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: dotnet test tests/TechStore.Auth.Tests --no-build --logger "trx;LogFileName=auth.trx" --results-directory test-results

      - name: Test - HTTP API and database privileges
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: dotnet test tests/TechStore.Api.Tests --no-build --logger "trx;LogFileName=api.trx" --results-directory test-results

      - name: Summarize test results
        if: ${{ !cancelled() }}
        run: |
          python3 - <<'PY'
          import glob, os, re
          rows = []
          for path in sorted(glob.glob("test-results/*.trx")):
              text = open(path, encoding="utf-8").read()
              counters = re.search(r'<Counters ([^>]*)/>', text)
              values = dict(re.findall(r'(\w+)="(\d+)"', counters.group(1))) if counters else {}
              rows.append((os.path.basename(path), values.get("total", "?"), values.get("passed", "?"), values.get("failed", "?")))
          lines = ["### Backend test results", "", "| Suite | Total | Passed | Failed |", "|---|---|---|---|"]
          lines += [f"| {name} | {total} | {passed} | {failed} |" for name, total, passed, failed in rows] or ["| (no results were produced) | | | |"]
          open(os.environ["GITHUB_STEP_SUMMARY"], "a").write("\n".join(lines) + "\n")
          PY

      # Test result files hold test names and failure messages only (the tests never print passwords), kept briefly.
      - name: Upload test results (failures only)
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-test-results
          path: test-results/*.trx
          retention-days: 7
          if-no-files-found: ignore

  frontend:
    name: Frontend build and tests
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22 # the same major version the web image is built with
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Installs exactly what package-lock.json says (and fails if package.json and the lockfile disagree).
      - name: Install dependencies
        id: install
        run: npm ci

      # Lint, build and tests are separate steps so one failure does not hide the others; any failing step fails the job.
      # --deny-warnings makes a lint warning fail the check (the code base has none today), so warnings cannot pile up unnoticed.
      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run lint -- --deny-warnings

      - name: Type-check and build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run build

      - name: Unit and component tests (Vitest)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm test -- --reporter=default --reporter=junit --outputFile.junit=../test-results/frontend.junit.xml

      - name: Summarize test results
        if: ${{ !cancelled() }}
        working-directory: .
        run: |
          python3 - <<'PY'
          import os, re
          lines = ["### Frontend test results", ""]
          path = "test-results/frontend.junit.xml"
          if os.path.exists(path):
              head = open(path, encoding="utf-8").read(4000)
              suite = re.search(r'<testsuites ([^>]*)>', head)
              values = dict(re.findall(r'(\w+)="([^"]*)"', suite.group(1))) if suite else {}
              lines += ["| Total | Failed | Errors |", "|---|---|---|",
                        f"| {values.get('tests', '?')} | {values.get('failures', '?')} | {values.get('errors', '?')} |"]
          else:
              lines.append("No test report was produced.")
          open(os.environ["GITHUB_STEP_SUMMARY"], "a").write("\n".join(lines) + "\n")
          PY

      # The JUnit file holds test names and failure messages only, kept briefly.
      - name: Upload test results (failures only)
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-test-results
          path: test-results/frontend.junit.xml
          retention-days: 7
          if-no-files-found: ignore

  browser:
    name: Browser tests (Playwright)
    needs: changes
    if: needs.changes.outputs.browser == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Same disposable PostgreSQL as the backend job. The tests create and drop their own database (techstore_e2e) in it.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Install Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      # The test harness applies the EF Core migrations to its own database with dotnet-ef, and needs psql to create that database.
      - name: Install dotnet-ef and check psql
        run: |
          dotnet tool install --global dotnet-ef --version 10.0.14
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"
          command -v psql >/dev/null || sudo apt-get install -y --no-install-recommends postgresql-client
          psql --version

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install the Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      # The test accounts get a random password for this run. It is created here so that it can be masked: GitHub then replaces
      # it with *** anywhere it would appear in a log.
      - name: Create a throw-away password for the test accounts
        run: |
          password="$(openssl rand -hex 16)"
          echo "::add-mask::$password"
          echo "E2E_PASSWORD=$password" >> "$GITHUB_ENV"

      - name: Run the Playwright suite
        working-directory: frontend
        run: npm run e2e

      # Screenshots of failing pages only. Traces, saved sessions and reports are never uploaded (see playwright.config.ts).
      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-test-screenshots
          path: |
            frontend/test-results/**/*.png
            !frontend/test-results/sessions/**
          retention-days: 3
          if-no-files-found: ignore

  ci-gate:
    name: CI gate
    # Every job above is listed here, and the gate judges every job listed (see below). Add new jobs to this list and give
    # "changes" an output with the same name as the job.
    needs: [changes, backend, frontend, browser]
    # Runs even when a job above failed, was skipped or was cancelled: those are exactly the cases it must judge.
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Evaluate the results
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys

          needs = json.loads(os.environ["NEEDS_JSON"])
          problems = []

          # The jobs that must exist in "needs" above. If someone removes one from the list, the gate fails instead of
          # silently ignoring it.
          CORE_JOBS = {"backend", "frontend", "browser"}
          for job in sorted(CORE_JOBS - needs.keys()):
              problems.append(f"'{job}' is missing from the gate's needs list")

          def result(job):
              return needs.get(job, {}).get("result", "missing")

          # The job that decides what must run has to have succeeded; otherwise nothing below can be trusted.
          if result("changes") != "success":
              problems.append(f"'changes' did not succeed (result: {result('changes')})")
          outputs = needs.get("changes", {}).get("outputs", {})

          # Every OTHER job in the needs list is judged, so a job added to "needs" can never be forgotten here. Its decision is the
          # "changes" output with the job's name and must be an explicit "true" or "false": a missing or garbled decision is a
          # failure, never "not required".
          print(f"{'job':<12} {'required':<9} result")
          for job in sorted(needs.keys() - {"changes"}):
              decision = outputs.get(job)
              res = result(job)
              if decision not in ("true", "false"):
                  problems.append(f"the decision for '{job}' is missing or invalid: {decision!r}")
                  print(f"{job:<12} {'?':<9} {res}")
                  continue
              must_run = decision == "true"
              print(f"{job:<12} {str(must_run):<9} {res}")
              # A skipped job is acceptable ONLY when it was explicitly not required.
              if must_run and res != "success":
                  problems.append(f"'{job}' was required but its result is '{res}'")
              elif not must_run and res not in ("skipped", "success"):
                  problems.append(f"'{job}' was not required but its result is '{res}'")

          if problems:
              print("\nCI gate: FAILED")
              for problem in problems:
                  print(" -", problem)
              sys.exit(1)
          print("\nCI gate: passed")
          PY
